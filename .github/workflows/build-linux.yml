name: Build AyuGram Linux

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch of AyuGram/AyuGramDesktop to build"
        default: "v7.2.9"
        required: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      IMAGE_TAG: tdesktop:centos_env

    steps:
      - name: Check secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Add TG_API_ID and TG_API_HASH in Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Clone upstream
        uses: actions/checkout@v4
        with:
          repository: AyuGram/AyuGramDesktop
          ref: ${{ inputs.ref }}
          submodules: true

      - name: Nested submodules
        run: git -C cmake submodule update --init --recursive --depth=1

      - name: Generate Dockerfile
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-jinja2
          cd Telegram/build/docker/centos_env
          DOCKERFILE=$(DEBUG= LTO= JOBS=2 python3 gen_dockerfile.py)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__
          head -5 Dockerfile

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - name: Set up Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore libraries cache
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-ayu-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.os }}-ayu-libs-

      - name: Build libraries image (slow on first run, 1.5-3 h)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

      - name: Save libraries cache
        if: steps.cache-libs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Build AyuGram
        run: |
          docker run --rm \
            -u $(id -u) \
            -v $PWD:/usr/src/tdesktop \
            -e CONFIG=Release \
            $IMAGE_TAG \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=${{ secrets.TG_API_ID }} \
            -D TDESKTOP_API_HASH=${{ secrets.TG_API_HASH }} \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON

      - name: Package
        run: |
          BIN=$(find out -type f -name AyuGram -perm -u+x | head -n 1)
          if [ -z "$BIN" ]; then
            echo "::error::AyuGram binary not found in out/"
            find out -maxdepth 3 -type f -perm -u+x
            exit 1
          fi
          echo "Found: $BIN"
          mkdir dist
          cp "$BIN" dist/AyuGram
          strip dist/AyuGram || true
          tar -C dist -czf ayugram-linux-x64-${{ inputs.ref }}.tar.gz AyuGram
          ls -lh ayugram-linux-x64-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ayugram-linux-x64
          path: ayugram-linux-x64-*.tar.gz
