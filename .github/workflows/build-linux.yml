name: Build AyuGram Linux

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch of AyuGram/AyuGramDesktop to build"
        default: "v7.2.9"
        required: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      IMAGE_TAG: tdesktop:centos_env
    steps:
      - name: Clone upstream
        uses: actions/checkout@v4
        with:
          repository: AyuGram/AyuGramDesktop
          ref: ${{ inputs.ref }}
          submodules: true

      - name: Nested submodules
        run: git -C cmake submodule update --init --recursive --depth=1

      - name: Generate Dockerfile
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-jinja2
          cd Telegram/build/docker/centos_env
          DEBUG= python3 gen_dockerfile.py > Dockerfile

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build libraries image (slow, 1.5-3 h)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Stub DesktopPrivate
        run: mkdir -p ../DesktopPrivate && touch ../DesktopPrivate/packer_private.h ../DesktopPrivate/alpha_private.h

      - name: Build AyuGram
        run: |
          docker run --rm \
            -u $(id -u) \
            -v $PWD:/usr/src/tdesktop \
            -v $PWD/../DesktopPrivate:/usr/src/DesktopPrivate \
            -e CONFIG=Release \
            $IMAGE_TAG \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D TDESKTOP_API_ID=${{ secrets.TG_API_ID }} \
            -D TDESKTOP_API_HASH=${{ secrets.TG_API_HASH }} \
            -D DESKTOP_APP_SPECIAL_TARGET=linux \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON

      - name: Package
        run: |
          mkdir dist
          cp out/Release/Telegram dist/AyuGram
          tar -C dist -czf ayugram-linux-x64-${{ inputs.ref }}.tar.gz AyuGram

      - uses: actions/upload-artifact@v4
        with:
          name: ayugram-linux-x64
          path: ayugram-linux-x64-*.tar.gz
